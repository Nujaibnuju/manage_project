<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow p-4">
                <h3 class="text-center mb-4">Create Account</h3>

                <form method="post" onsubmit="return validateForm()">
                    {% csrf_token %}

                    <!-- Username -->
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
    <label class="form-label">Password</label>
    <div class="input-group">
        <input type="password" id="password" name="password" class="form-control" required>

        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword(this)">
            <i class="bi bi-eye"></i>
        </button>
    </div>
</div>
                    <!-- Role -->
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select">
                            <option value="admin">Admin</option>
                            <option value="student">Student</option>
                        </select>
                    </div>

                    <!-- Button -->
                    <button type="submit" class="btn btn-dark w-100">
                        Register
                    </button>

                    <!-- Django Messages -->
                    {% if success %}
                        <p class="text-success mt-2">{{ success }}</p>
                    {% endif %}

                    <p id="errorMsg" class="text-danger mt-2"></p>

                </form>

                <p class="text-center mt-3">
                    Already have an account?
                    <a href="{% url 'get_login' %}">Login</a>
                </p>
            </div>

        </div>
    </div>
</div>

<!-- JS -->
<script>
    function togglePassword() {
        let password = document.getElementById("password");
        let btn = event.target;

        if (password.type === "password") {
            password.type = "text";
            btn.innerText = "Hide";
        } else {
            password.type = "password";
            btn.innerText = "Show";
        }
    }

    function validateForm() {
        let username = document.getElementById("username").value.trim();
        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value.trim();
        let errorMsg = document.getElementById("errorMsg");

        errorMsg.innerText = "";

        // Username check
        if (username.length < 3) {
            errorMsg.innerText = "Username must be at least 3 characters";
            return false;
        }

        // Email validation
        let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if (!email.match(emailPattern)) {
            errorMsg.innerText = "Enter a valid email";
            return false;
        }

        // Password validation
        if (password.length < 6) {
            errorMsg.innerText = "Password must be at least 6 characters";
            return false;
        }

        return true;
    }
</script>


    <script>
function togglePassword(btn) {
    let password = document.getElementById("password");
    let icon = btn.querySelector("i");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    } else {
        password.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    }
}
</script>


</body>
</html>
